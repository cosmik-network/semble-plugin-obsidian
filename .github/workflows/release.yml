# Push a tag that matches manifest.json's version (e.g. `0.1.0`, no `v` prefix)
# to build the plugin and open a draft GitHub release with the required assets.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write # create the release
  id-token: write # sign the attestations
  attestations: write # store the attestations
  artifact-metadata: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Check tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p 'require("./manifest.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag doesn't match manifest.json version $version"
            exit 1
          fi
          node -e 'const v = require("./versions.json"); process.exit(v[process.argv[1]] ? 0 : 1)' "$version" \
            || { echo "::error::versions.json has no entry for $version"; exit 1; }

      - name: Build
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # Lets users verify the release files were built here, from this tag:
      # gh attestation verify main.js --repo cosmik-network/semble-plugin-obsidian
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
